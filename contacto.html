<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Belleza</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/contacto.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-izq">
    <img src="icon/logo belleza 2.png" class="logo">
    <div class="texto-header">
      <h1>Contacto</h1>
      <p>Escríbenos y resolveremos tus dudas</p>
    </div>
  </div>

  <div class="header-der">
    <a href="index.html" class="btn btn-primary">Inicio</a>
    <a href="servicios.html" class="btn btn-primary">Servicios</a>
    <a href="somos.html" class="btn btn-primary">Somos</a>
  </div>
</header>

<!-- ================= FORMULARIO ================= -->
<section class="container my-5">

  <h2 class="text-center mb-4" style="color:#6b0661;">Contáctanos</h2>

  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow p-4">

        <form id="formContacto">

          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono">
          </div>

          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Enviar Mensaje
          </button>

        </form>

      </div>

    </div>
  </div>

</section>

<!-- ================= FOOTER ================= -->
<footer class="d-flex justify-content-center align-items-center"
        style="background:#de4793; color:white; height:60px;">
  <p class="mb-0">© 2026 Belleza</p>
</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔥 SCRIPT MODERNO -->
<script type="module" src="js/contacto.js"></script>

</body>
</html>
