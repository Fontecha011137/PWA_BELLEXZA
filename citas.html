<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Cita - Belleza</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="logo-titulo">
    <img src="icon/logo belleza 2.png" class="logo">
    <h1>Agendar Cita</h1>
  </div>

  <div class="menu-header">
    <button onclick="location.href='index.html'">Inicio</button>
    <button onclick="location.href='servicios.html'">Servicios</button>
  </div>
</header>

<!-- ================= FORMULARIO ================= -->
<section class="contenedor">

  <div class="card">
    <h2>Agendar tu cita</h2>

    <form id="formCita">

      <!-- SERVICIO (AUTOMÁTICO) -->
      <label>Servicio</label>
      <input type="text" id="servicio" readonly>

      <!-- FECHA -->
      <label>Fecha</label>
      <input type="date" id="fecha" required>

      <!-- HORA -->
      <label>Hora</label>
      <input type="time" id="hora" required>

      <!-- DIRECCIÓN DESDE FIREBASE -->
      <label>Selecciona tu dirección</label>
      <select id="direccion" required>
        <option value="">Cargando direcciones...</option>
      </select>

      <button type="submit">Agendar</button>

    </form>

  </div>

</section>

<!-- ================= SCRIPT ================= -->
<script type="module" src="js/citas.js"></script>

</body>
</html>
