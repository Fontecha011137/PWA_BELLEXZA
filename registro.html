<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Belleza</title>
  
  <!-- ================= BOOTSTRAP ================= -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- ================= CSS ================= -->
  <link rel="stylesheet" href="css/registro.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-izq">
    <img src="icon/logo belleza 2.png" class="logo">
    <div class="texto-header">
      <h1>Registro</h1>
      <p>Crea tu cuenta para agendar tus citas</p>
    </div>
  </div>

  <div class="header-der">
    <a href="index.html" class="btn btn-primary">Inicio</a>
    <a href="servicios.html" class="btn btn-primary">Servicios</a>
  </div>
</header>

<!-- ================= FORMULARIO ================= -->
<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">

        <h2 class="text-center mb-4" style="color:#6b0661;">
          Crear Cuenta
        </h2>

        <form id="formRegistro">

          <!-- NOMBRE -->
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>

          <!-- EMAIL -->
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <!-- PASSWORD -->
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required>
          </div>

          <!-- TELÉFONO -->
          <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono">
          </div>

          <!-- DIRECCION -->
          <div class="mb-3">
            <label class="form-label">Dirección Principal</label>
            <input type="text" class="form-control" id="direccion1">
          </div>

          <!-- DIRECCION2 -->
          <div class="mb-3">
            <label class="form-label">Dirección Opcional</label>
            <input type="text" class="form-control" id="direccion2">
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Registrarse
          </button>

        </form>

      </div>
    </div>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="d-flex justify-content-center align-items-center"
        style="background:#de4793; color:white; height:60px;">
  <p class="mb-0">© 2026 Belleza</p>
</footer>

<!-- ================= BOOTSTRAP ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= FIREBASE ================= -->
<script type="module">

/* ======================================================
   IMPORTACIONES FIREBASE
====================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ======================================================
   CONFIGURACIÓN
====================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC7Q6Kvn0klC_OIByWIWe4-o7NiJ1D0SLQ",
  authDomain: "pwabelleza.firebaseapp.com",
  projectId: "pwabelleza",
  storageBucket: "pwabelleza.firebasestorage.app",
  messagingSenderId: "36813965033",
  appId: "1:36813965033:web:9b760c75eade1e2b079278"
};

/* ======================================================
   INICIALIZAR
====================================================== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ======================================================
   FORMULARIO
====================================================== */
const form = document.getElementById("formRegistro");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const nombre = document.getElementById("nombre").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const telefono = document.getElementById("telefono").value;

  /* ======================================================
     VALIDACIONES
  ====================================================== */
  if (password.length < 6) {
    alert("⚠️ La contraseña debe tener mínimo 6 caracteres");
    return;
  }

  try {

    /* ================= CREAR USUARIO ================= */
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    /* ================= GUARDAR DATOS ================= */
    await setDoc(doc(db, "usuarios", user.uid), {
      nombre,
      email,
      telefono,
      rol: "cliente", // 🔥 importante para admin luego
      fechaRegistro: new Date()
    });

    alert("✅ Registro exitoso");

    window.location.href = "login.html";

  } catch (error) {

    console.error(error);

    /* ================= MENSAJES CLAROS ================= */
    if (error.code === "auth/email-already-in-use") {
      alert("⚠️ Este usuario ya se encuentra registrado");
    } else if (error.code === "auth/invalid-email") {
      alert("⚠️ El correo no es válido");
    } else {
      alert("Error: " + error.message);
    }

  }

});

</script>

</body>
</html>
