<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Belleza</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="css/inicio.css">

</head>

<body>

<!-- ================= HEADER ================= -->
<header class="container py-3">

<div class="row align-items-center">

<!-- LOGO -->
<div class="col-md-2 text-center">
<img src="icon/logo belleza 2.png" class="logo img-fluid">
</div>

<!-- TEXTO -->
<div class="col-md-6 text-center text-md-start">
<h1>Bienvenido a Belleza</h1>

<!-- 👤 AQUÍ SE MOSTRARÁ EL USUARIO -->
<p id="usuarioNombre">Descubre nuestros servicios diseñados para resaltar tu belleza.</p>
</div>

<!-- MENU -->
<div class="col-md-4 text-center text-md-end">

<a href="servicios.html" class="btn btn-primary">Servicios</a>

<a href="registro.html" class="btn btn-primary" id="btnRegistro">
Registrate
</a>

<a href="login.html" class="btn btn-primary" id="btnLogin">
Login
</a>

<!-- 🔐 BOTÓN LOGOUT -->
<button id="btnLogout" class="btn btn-danger" style="display:none;">
Cerrar sesión
</button>

</div>

</div>

</header>

<!-- ================= SERVICIOS ================= -->
<section class="container my-5">

<h2 class="text-center mb-4">Nuestros Servicios</h2>

<div id="carouselServicios" class="carousel slide" data-bs-ride="carousel">

<div class="carousel-inner">

<!-- ITEM 1 -->
<div class="carousel-item active">
<img src="icon/depilacion.jpg" class="d-block w-100">
<div class="carousel-caption">
<h5>Depilación con cera</h5>
<p>Piel suave y limpia por más tiempo</p>
</div>
</div>

<!-- ITEM 2 -->
<div class="carousel-item">
<img src="icon/decorado.jpg" class="d-block w-100">
<div class="carousel-caption">
<h5>Diseños de uñas</h5>
<p>Estilo único y moderno</p>
</div>
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#carouselServicios" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carouselServicios" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>

</section>

<!-- ================= FOOTER ================= -->
<footer class="text-center p-3" style="background:#de4793; color:white;">
© 2026 Belleza
</footer>

<!-- ================= BOOTSTRAP ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= FIREBASE ================= -->
<script type="module">

/* ================= IMPORTAR FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyC7Q6Kvn0klC_OIByWIWe4-o7NiJ1D0SLQ",
  authDomain: "pwabelleza.firebaseapp.com",
  projectId: "pwabelleza",
  storageBucket: "pwabelleza.firebasestorage.app",
  messagingSenderId: "36813965033",
  appId: "1:36813965033:web:9b760c75eade1e2b079278"
};

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

console.log("🔥 Firebase funcionando en INDEX");

/* ================= ELEMENTOS ================= */
const usuarioNombre = document.getElementById("usuarioNombre");
const btnLogout = document.getElementById("btnLogout");
const btnLogin = document.getElementById("btnLogin");
const btnRegistro = document.getElementById("btnRegistro");

/* ================= DETECTAR USUARIO ================= */
onAuthStateChanged(auth, async (user) => {

  console.log("Usuario:", user);

  if (user) {

    try {

      const docRef = doc(db, "usuarios", user.uid);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        usuarioNombre.innerText = "Hola, " + docSnap.data().nombre + " 👋";
      } else {
        usuarioNombre.innerText = "Hola 👋";
      }

      btnLogout.style.display = "inline-block";
      btnLogin.style.display = "none";
      btnRegistro.style.display = "none";

    } catch (error) {
      console.error(error);
    }

  } else {

    usuarioNombre.innerText = "Descubre nuestros servicios diseñados para resaltar tu belleza.";

    btnLogout.style.display = "none";
    btnLogin.style.display = "inline-block";
    btnRegistro.style.display = "inline-block";

  }

});

/* ================= LOGOUT ================= */
btnLogout.addEventListener("click", async () => {

  await signOut(auth);

  alert("Sesión cerrada");

  location.reload();

});

</script>

</body>
</html>
