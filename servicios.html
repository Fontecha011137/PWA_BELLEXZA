<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Belleza</title>

<!-- ================= ESTILOS ================= -->
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">

  <!-- Logo y nombre -->
  <div class="logo-titulo">
    <img src="icon/logo belleza 2.png" class="logo">
    <h1>Belleza</h1>
  </div>

  <!-- Botones usuario -->
  <div class="menu-header">

    <!-- Botón registrarse -->
    <button id="btnRegistro" onclick="location.href='registro.html'">
      Registrate
    </button>

    <!-- Botón login -->
    <button id="btnLogin" onclick="location.href='login.html'">
      Login
    </button>

    <!-- Botón cerrar sesión (oculto al inicio) -->
    <button id="btnLogout" style="display:none;">
      Cerrar sesión
    </button>

  </div>

</header>

<!-- ================= NAV ================= -->
<nav>
  <a href="index.html">Inicio</a>
  <a href="somos.html">Quienes Somos</a>
  <a href="contacto.html">Contactanos</a>
</nav>

<!-- ================= SERVICIOS ================= -->
<section class="contenedor">

  <!-- Servicio uñas -->
  <div class="card">
    <h2>Uñas</h2>
    <img src="icon/postizas.jpg" alt="Uñas">
    <p>Servicios completos de uñas</p>
    <button onclick="irServicio('uñas.html')">Ver</button>
  </div>

  <!-- Servicio depilación -->
  <div class="card">
     <img src="icon/depilacion.jpg" alt="Depilación">
    <h2>Depilación</h2>
    <p>Servicios de depilación</p>
    <button onclick="irServicio('depilacion.html')">Ver</button>
  </div>

</section>

<!-- ================= FOOTER ================= -->
<footer>
  <p>© 2026 Belleza</p>
</footer>

<!-- ================= FIREBASE ================= -->
<script type="module">

/* ======================================================
   🔥 DEBUG → Esto nos permite saber si el script carga
====================================================== */
console.log("🔥 SERVICIOS FUNCIONANDO");

/* ======================================================
   IMPORTACIONES DE FIREBASE
====================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ======================================================
   CONFIGURACIÓN DEL PROYECTO FIREBASE
====================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC7Q6Kvn0klC_OIByWIWe4-o7NiJ1D0SLQ",
  authDomain: "pwabelleza.firebaseapp.com",
  projectId: "pwabelleza",
  storageBucket: "pwabelleza.firebasestorage.app",
  messagingSenderId: "36813965033",
  appId: "1:36813965033:web:9b760c75eade1e2b079278"
};

/* ======================================================
   INICIALIZACIÓN
====================================================== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ======================================================
   ELEMENTOS DEL DOM
====================================================== */
const btnLogin = document.getElementById("btnLogin");
const btnRegistro = document.getElementById("btnRegistro");
const btnLogout = document.getElementById("btnLogout");

/* ======================================================
   DETECTAR ESTADO DEL USUARIO
   Se ejecuta automáticamente si el usuario está logueado
====================================================== */
onAuthStateChanged(auth, (user) => {

  console.log("Usuario en servicios:", user);

  if (user) {
    // Usuario autenticado

    btnLogin.style.display = "none";
    btnRegistro.style.display = "none";
    btnLogout.style.display = "inline-block";

  } else {
    // Usuario NO autenticado

    btnLogin.style.display = "inline-block";
    btnRegistro.style.display = "inline-block";
    btnLogout.style.display = "none";
  }

});

/* ======================================================
   CERRAR SESIÓN
====================================================== */
btnLogout.addEventListener("click", async () => {

  await signOut(auth);

  alert("Sesión cerrada");

  location.reload();

});

/* ======================================================
   REDIRECCIÓN A SERVICIOS
====================================================== */
window.irServicio = (pagina) => {
  window.location.href = pagina;
};

</script>

</body>
</html>
