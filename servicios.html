<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Belleza</title>

<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">

<div class="logo-titulo">
<img src="icon/logo belleza 2.png" class="logo">
<h1>Belleza</h1>
</div>

<div class="menu-header">
<button onclick="location.href='registro.html'">Registrate</button>
<button onclick="location.href='login.html'">Login</button>
</div>

</header>

<!-- ================= NAV ================= -->
<nav>
    <a href="index.html">Inicio</a>
    <a href="somos.html">Quienes Somos</a>
    <a href="contacto.html">Contactanos</a>
</nav>

<!-- ================= SERVICIOS ================= -->
<section class="contenedor" id="contenedorServicios">
</section>

<!-- ================= FOOTER ================= -->
<footer>
    <p>© 2026 Belleza</p>
</footer>

<!-- ================= FIREBASE ================= -->
<script type="module">

/* ================= IMPORTACIONES ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyC7Q6Kvn0klC_OIByWIWe4-o7NiJ1D0SLQ",
  authDomain: "pwabelleza.firebaseapp.com",
  projectId: "pwabelleza",
  storageBucket: "pwabelleza.firebasestorage.app",
  messagingSenderId: "36813965033",
  appId: "1:36813965033:web:9b760c75eade1e2b079278"
};

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let usuarioActual = null;

/* ================= DETECTAR USUARIO ================= */
onAuthStateChanged(auth, (user) => {
  usuarioActual = user;
});

/* ================= CARGAR SERVICIOS ================= */
const contenedor = document.getElementById("contenedorServicios");

async function cargarServicios() {

  const querySnapshot = await getDocs(collection(db, "servicios"));

  contenedor.innerHTML = "";

  querySnapshot.forEach((doc) => {

    const servicio = doc.data();

    const card = document.createElement("div");
    card.classList.add("card");

    card.innerHTML = `
      <h2>${servicio.nombre}</h2>
      <p>${servicio.descripcion}</p>
      <p><strong>Precio:</strong> $${servicio.precio}</p>

      <button onclick="agendar('${servicio.nombre}')">
        Agendar
      </button>
    `;

    contenedor.appendChild(card);

  });

}

/* ================= AGENDAR ================= */
window.agendar = (servicio) => {

  if (!usuarioActual) {
    alert("⚠️ Debes iniciar sesión para agendar");
    window.location.href = "login.html";
    return;
  }

  window.location.href = `citas.html?servicio=${servicio}`;
};

/* ================= INICIAR ================= */
cargarServicios();

</script>

</body>
</html>
