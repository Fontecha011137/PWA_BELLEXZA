<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Belleza</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- CSS personalizado -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-izq">
    <img src="icon/logo belleza 2.png" class="logo" alt="Logo Belleza">
    <div class="texto-header">
      <h1>Login</h1>
      <p>Ingresa a tu cuenta para agendar tus citas</p>
    </div>
  </div>
  <div class="header-der">
    <a href="index.html" class="btn btn-primary">Inicio</a>
    <a href="servicios.html" class="btn btn-primary">Servicios</a>
  </div>
</header>

<!-- Formulario de Login -->
<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">
        <h2 class="text-center mb-4" style="color:#6b0661;">Iniciar Sesión</h2>
        
        <form id="formLogin">
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <p class="text-center mt-3">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="d-flex justify-content-center align-items-center" style="background:#de4793; color:white; height:60px;">
  <p class="mb-0">© 2026 Belleza</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- Tu JS personalizado -->
<script src="js/login.js"></script>

</body>
</html>
