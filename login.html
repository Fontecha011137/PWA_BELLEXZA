<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Belleza</title>

  <!-- ================= BOOTSTRAP ================= -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ================= CSS ================= -->
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-izq">
    <img src="icon/logo belleza 2.png" class="logo" alt="Logo">

    <div class="texto-header">
      <h1>Login</h1>
      <p>Ingresa a tu cuenta para agendar tus citas</p>
    </div>
  </div>

  <div class="header-der">
    <a href="index.html" class="btn btn-primary">Inicio</a>
    <a href="servicios.html" class="btn btn-primary">Servicios</a>
  </div>
</header>

<!-- ================= FORMULARIO ================= -->
<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">

        <h2 class="text-center mb-4" style="color:#6b0661;">
          Iniciar Sesión
        </h2>

        <form id="formLogin">

          <!-- EMAIL -->
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <!-- PASSWORD -->
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required>
          </div>

          <!-- BOTÓN -->
          <button type="submit" class="btn btn-primary w-100">
            Ingresar
          </button>

        </form>

        <!-- 🔐 RECUPERAR CONTRASEÑA -->
        <p class="text-center mt-3">
          <a href="#" id="recuperar">¿Olvidaste tu contraseña?</a>
        </p>

        <!-- REGISTRO -->
        <p class="text-center mt-2">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>

      </div>
    </div>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="d-flex justify-content-center align-items-center"
        style="background:#de4793; color:white; height:60px;">
  <p class="mb-0">© 2026 Belleza</p>
</footer>

<!-- ================= BOOTSTRAP ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= FIREBASE ================= -->
<script type="module">

/* ======================================================
   IMPORTACIONES FIREBASE
====================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  sendPasswordResetEmail 
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ======================================================
   CONFIGURACIÓN
====================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC7Q6Kvn0klC_OIByWIWe4-o7NiJ1D0SLQ",
  authDomain: "pwabelleza.firebaseapp.com",
  projectId: "pwabelleza",
  storageBucket: "pwabelleza.firebasestorage.app",
  messagingSenderId: "36813965033",
  appId: "1:36813965033:web:9b760c75eade1e2b079278"
};

/* ======================================================
   INICIALIZAR FIREBASE
====================================================== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

console.log("🔥 Firebase Login activo");

/* ======================================================
   LOGIN
====================================================== */
const formLogin = document.getElementById("formLogin");

formLogin.addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {

    // 🔐 Autenticación
    await signInWithEmailAndPassword(auth, email, password);

    alert("✅ Inicio de sesión exitoso");

    window.location.href = "index.html";

  } catch (error) {

    console.error(error);

    // 🔥 MENSAJES PERSONALIZADOS
    if (error.code === "auth/user-not-found") {
      alert("⚠️ Usuario no registrado");
    } else if (error.code === "auth/wrong-password") {
      alert("⚠️ Contraseña incorrecta");
    } else if (error.code === "auth/invalid-email") {
      alert("⚠️ Correo inválido");
    } else {
      alert("Error: " + error.message);
    }

  }

});

/* ======================================================
   RECUPERAR CONTRASEÑA
====================================================== */
const recuperar = document.getElementById("recuperar");

recuperar.addEventListener("click", async () => {

  const email = document.getElementById("email").value;

  if (!email) {
    alert("⚠️ Ingresa tu correo primero");
    return;
  }

  try {

    await sendPasswordResetEmail(auth, email);

    alert("📧 Revisa tu correo para recuperar tu contraseña");

  } catch (error) {

    console.error(error);
    alert("Error: " + error.message);

  }

});

</script>

</body>
</html>
